<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Taskify</title>
        <link rel="stylesheet" href="style.css">
        
    </head>
    <body>
        <h1>Taskify</h1>
        <div class="task-form">
            <h3>Task Name</h3>
            <input type="text" id="taskInput">
            <button id="addBtn">Add Task</button>
        </div>
        <div class="columns">
            <div class="column">
                <h2>To Do</h2>
        <div id="todo-list"></div>
        </div>
        <div class="column">
            <h2>In Progress</h2>
        <div id="progress-list"></div>
        </div>
        <div class="column">
            <h2>Done</h2>
        <div id="done-list"></div>
        </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
